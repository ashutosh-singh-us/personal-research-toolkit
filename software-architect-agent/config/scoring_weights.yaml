# Recommendation Scoring Weights
# ================================
# Each dimension is scored 1-10 per solution. Weights must sum to 100%.
# Adjust weights before scoring based on engagement context.

scoring_dimensions:

  business_alignment:
    weight: 0.15
    category: Business
    description: "How well does this solve the actual business problem?"
    scoring_guidance: |
      10: Directly and completely solves the stated business problem with measurable impact.
      7-9: Solves the core problem with minor gaps or indirect benefits.
      4-6: Partially addresses the business need; requires additional work for full value.
      1-3: Tangentially related to the business problem; most value is technical, not business.

  time_to_value:
    weight: 0.12
    category: Business
    description: "How quickly does this deliver usable functionality?"
    scoring_guidance: |
      10: Delivers value within days/weeks; incremental delivery possible from day one.
      7-9: Delivers core value within the stated timeline; phased approach viable.
      4-6: Tight timeline fit; significant risk of delays or incomplete initial delivery.
      1-3: Cannot deliver meaningful value within the stated timeline.

  technical_soundness:
    weight: 0.12
    category: Technical
    description: "Is the architecture fundamentally sound?"
    scoring_guidance: |
      10: Well-established patterns, proven at scale, no known architectural risks.
      7-9: Sound architecture with minor concerns or untested combinations.
      4-6: Workable but introduces architectural risks or anti-patterns.
      1-3: Fundamentally flawed; likely to require rearchitecting within 1-2 years.

  scalability_headroom:
    weight: 0.08
    category: Technical
    description: "Can this handle 10x growth without rearchitecting?"
    scoring_guidance: |
      10: Horizontally scalable by design; 10x growth requires only capacity additions.
      7-9: Scales well with minor adjustments (index tuning, cache layers, etc.).
      4-6: Scales to 3-5x; 10x would require meaningful changes.
      1-3: Will hit hard limits before 2x growth; vertical scaling only.

  failure_resilience:
    weight: 0.10
    category: Technical
    description: "How gracefully does it handle failures?"
    scoring_guidance: |
      10: Graceful degradation, self-healing, blast radius contained, automated recovery.
      7-9: Handles common failure modes; some manual intervention for edge cases.
      4-6: Single points of failure exist; partial outages cascade to users.
      1-3: Brittle; failures cascade widely, manual recovery required, data loss risk.

  operational_simplicity:
    weight: 0.10
    category: Operational
    description: "How easy is this to deploy, monitor, and debug?"
    scoring_guidance: |
      10: Standard deployment pipeline, clear observability, straightforward debugging.
      7-9: Mostly standard ops; one or two components need special handling.
      4-6: Requires new operational tooling or processes; moderate debugging complexity.
      1-3: Complex multi-step deployments, poor observability, hard to debug in production.

  team_fit:
    weight: 0.10
    category: Organizational
    description: "Can the available team realistically build and own this?"
    scoring_guidance: |
      10: Team has deep experience with all required technologies and patterns.
      7-9: Team knows the core stack; minor learning curve on 1-2 new components.
      4-6: Significant learning required; team can do it but slower than expected.
      1-3: Team lacks fundamental skills; would need hiring or extensive training.

  organizational_alignment:
    weight: 0.05
    category: Organizational
    description: "Does this work with (not against) team/org boundaries?"
    scoring_guidance: |
      10: Maps perfectly to existing team ownership; no cross-team coordination needed.
      7-9: Mostly aligns; one or two coordination points with other teams.
      4-6: Requires moderate cross-team coordination or shared ownership.
      1-3: Fights the org structure; requires org changes or heavy cross-team dependency.

  reversibility:
    weight: 0.08
    category: Risk
    description: "How easy is it to change course if this is wrong?"
    scoring_guidance: |
      10: All major decisions are two-way doors; easy to pivot.
      7-9: Most decisions reversible; one or two hard-to-undo choices (with mitigation).
      4-6: Several one-way doors; migration path exists but is expensive.
      1-3: Deeply committed from day one; changing direction means starting over.

  complexity_budget:
    weight: 0.05
    category: Risk
    description: "How much ongoing complexity does this add to the system?"
    scoring_guidance: |
      10: Minimal new complexity; leverages existing patterns and infrastructure.
      7-9: Adds moderate complexity in one area; well-contained.
      4-6: Adds complexity across multiple areas; increases cognitive load.
      1-3: Dramatically increases system complexity; new failure modes, new tooling, new mental models.

  security_compliance:
    weight: 0.05
    category: Compliance
    description: "Does this meet regulatory and security requirements?"
    scoring_guidance: |
      10: Fully compliant by design; uses approved patterns and infrastructure.
      7-9: Compliant with minor adjustments (encryption config, access controls).
      4-6: Requires security review; some patterns may need approval.
      1-3: Introduces new compliance scope or uses unapproved patterns.

# Weight Adjustment Presets
# ========================
# Use these as starting points when context suggests non-default weights.

presets:
  timeline_critical:
    description: "When delivery speed is the primary constraint"
    adjustments:
      time_to_value: 0.20
      business_alignment: 0.15
      operational_simplicity: 0.12
      team_fit: 0.12
      technical_soundness: 0.10
      failure_resilience: 0.08
      reversibility: 0.08
      scalability_headroom: 0.05
      complexity_budget: 0.05
      organizational_alignment: 0.03
      security_compliance: 0.02

  greenfield:
    description: "New system with no legacy constraints"
    adjustments:
      technical_soundness: 0.18
      scalability_headroom: 0.12
      failure_resilience: 0.12
      business_alignment: 0.15
      time_to_value: 0.10
      operational_simplicity: 0.08
      team_fit: 0.08
      reversibility: 0.07
      complexity_budget: 0.05
      organizational_alignment: 0.03
      security_compliance: 0.02

  regulated_domain:
    description: "PCI-DSS, PIPEDA, GDPR, or similar regulatory scope"
    adjustments:
      security_compliance: 0.20
      business_alignment: 0.15
      failure_resilience: 0.12
      technical_soundness: 0.12
      operational_simplicity: 0.10
      time_to_value: 0.08
      team_fit: 0.08
      reversibility: 0.05
      scalability_headroom: 0.05
      complexity_budget: 0.03
      organizational_alignment: 0.02

  junior_team:
    description: "Team with limited experience in the target stack"
    adjustments:
      team_fit: 0.18
      operational_simplicity: 0.15
      complexity_budget: 0.10
      business_alignment: 0.12
      time_to_value: 0.10
      technical_soundness: 0.10
      reversibility: 0.08
      failure_resilience: 0.07
      scalability_headroom: 0.05
      organizational_alignment: 0.03
      security_compliance: 0.02
